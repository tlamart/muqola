# Production profile; no build and no published app/DB ports.
name: ${MUQOLA_PROJECT:-muqola-prod}
x-delivery: &delivery
  DEPLOYMENT_ENV: production
  EMAIL_HOST: ${EMAIL_HOST:?EMAIL_HOST required}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:?EMAIL_HOST_USER required}
  EMAIL_HOST_PASSWORD_FILE: /run/secrets/smtp_password
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM required}
services:
  db:
    extends: {file: compose.runtime.yaml, service: db}
  web:
    extends: {file: compose.runtime.yaml, service: web}
    environment: *delivery
    secrets: [smtp_password]
    networks:
      private: {}
      proxy: {aliases: [muqola-web]}
  worker:
    extends: {file: compose.runtime.yaml, service: worker}
    environment: *delivery
    secrets: [smtp_password]
  migrate:
    extends: {file: compose.runtime.yaml, service: migrate}
    environment: *delivery
    secrets: [smtp_password]
secrets:
  django_key: {file: '${SECRETS_DIR:?SECRETS_DIR required}/django_key'}
  db_admin_password: {file: '${SECRETS_DIR:?SECRETS_DIR required}/db_admin_password'}
  db_migrate_password: {file: '${SECRETS_DIR:?SECRETS_DIR required}/db_migrate_password'}
  db_app_password: {file: '${SECRETS_DIR:?SECRETS_DIR required}/db_app_password'}
  smtp_password: {file: '${SECRETS_DIR:?SECRETS_DIR required}/smtp_password'}
volumes:
  postgres_data:
# Former Caddy volumes are intentionally not removed by this configuration.
networks:
  private: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
