[defaults]
inventory = inventory.local.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
display_args_to_stdout = False
fact_caching = memory
interpreter_python = /usr/bin/python3

[diff]
always = False

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o ForwardAgent=no
