{% load game_visuals %}{% with illustration=game.illustration %}
<figure class="game-art{% if compact %} game-art--compact{% endif %}">
<div class="game-art__frame">
<div class="game-cover game-cover--{{ game.pk|cover_tone }}{% if large %} detail-cover{% endif %}" aria-hidden="true">
<span class="game-cover__title">{{ game.title }}</span>
<span class="game-cover__marks"><span class="cover-emblem">◆</span><span class="cover-caption">JEU DE SOCIÉTÉ</span></span>
</div>
{% if illustration.displayable and not game.hidden %}<img class="game-art__image" data-commons-image src="{{ illustration.image_url }}" alt="{% if not defer_credits %}Illustration de {{ game.title }}{% endif %}" loading="lazy" decoding="async" referrerpolicy="no-referrer">{% endif %}
</div>
{% if not defer_credits %}<figcaption>{% include 'components/game_credits.html' %}</figcaption>{% endif %}
</figure>{% endwith %}
