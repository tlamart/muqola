name: Automatic staging delivery
run-name: "Staging — main CI ${{ github.event.workflow_run.id }} / ${{ github.event.workflow_run.head_sha }}"
on:
  workflow_run:
    workflows: [Muqola checks]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: delivery-staging
  cancel-in-progress: false
jobs:
  staging:
    if: >-
      github.repository == 'tlamart/muqola' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'tlamart/muqola' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.conclusion == 'success'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Authenticate read-only registry access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf 'DOCKER_CONFIG=%s/muqola-staging-auth\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$RUNNER_TEMP/muqola-staging-auth"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Verify publication and deploy only staging through its controller
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m deploy.staging_delivery
      - name: Preserve automatic plan and result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muqola-auto-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/plan.json
            work/staging-result.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Logout
        if: always()
        run: docker logout ghcr.io
