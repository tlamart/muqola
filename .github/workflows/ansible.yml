name: Ansible checks (synthetic only)
on:
  pull_request:
    branches: [main]
    paths:
      - infra/ansible/**
      - .github/workflows/ansible.yml
      - .gitignore
      - .dockerignore
      - muqola/operations/management/commands/promote_operator.py
  push:
    branches: [main]
    paths:
      - infra/ansible/**
      - .github/workflows/ansible.yml
      - .gitignore
      - .dockerignore
      - muqola/operations/management/commands/promote_operator.py
permissions:
  contents: read
concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: target
        with:
          python-version: '3.13'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: infra/ansible/uv.lock
      - name: Keep temporary Ansible state on the runner
        run: |
          printf 'ANSIBLE_LOCAL_TEMP=%s/ansible-local\nANSIBLE_HOME=%s/ansible-home\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run --frozen ansible-lint --offline
      - name: Syntax check with an unresolvable example host (no connection)
        run: |
          uv run --frozen ansible-playbook -i inventory.example.yml playbooks/audit.yml --syntax-check
          uv run --frozen ansible-playbook -i inventory.example.yml playbooks/adopt.yml --syntax-check
          uv run --frozen ansible-playbook -i inventory.example.yml playbooks/promote-operator.yml --syntax-check
      - name: Adoption and privacy on temporary local fixtures only
        env:
          MUQOLA_TEST_PYTHON: ${{ steps.target.outputs.python-path }}
        run: uv run --frozen python -m unittest discover -s tests -v
