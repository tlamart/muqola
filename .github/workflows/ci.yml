name: Muqola checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DJANGO_SECRET_KEY: ci-only-synthetic-key-00000000000000000000000000000000000000000000
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: muqola
      POSTGRES_USER: muqola
      POSTGRES_PASSWORD: ci-only-local-password
      POSTGRES_HOST: 127.0.0.1
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: muqola
          POSTGRES_USER: muqola
          POSTGRES_PASSWORD: ci-only-local-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U muqola -d muqola"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv sync --frozen --group browser
      - name: Check generated runtime lock
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - run: ./scripts/check.sh
      - name: Django production settings check
        run: APP_BASE_URL=https://muqola.example.test APP_ENV=production uv run --frozen python manage.py check --deploy --fail-level WARNING
      - name: Audit runtime dependencies
        run: uv run --frozen pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off
      - name: Start a clean Compose stack (build, migration, healthcheck)
        run: |
          python scripts/init_dev.py
          docker compose up --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8000/health/ready/
          docker compose exec -T web python manage.py send_dev_email
          curl --fail http://127.0.0.1:8025/api/v1/messages | python -c 'import json,sys; assert json.load(sys.stdin)["total"] >= 1'
      - name: Gunicorn stays available with silent TCP preconnections
        run: |
          python - <<'PY'
          import http.client
          import socket
          import time
          from contextlib import ExitStack, closing
          from config.gunicorn import timeout, workers, threads

          with ExitStack() as stack:
              for _ in range(workers * threads + 4):
                  stack.enter_context(socket.create_connection(("127.0.0.1", 8000), timeout=2))
              time.sleep(0.2)
              connection = stack.enter_context(closing(http.client.HTTPConnection("127.0.0.1", 8000, timeout=2)))
              deadline = time.monotonic() + timeout + 2
              probes = 0
              while time.monotonic() < deadline:
                  for path in ("/health/live/", "/health/ready/"):
                      connection.request("GET", path)
                      response = connection.getresponse()
                      response.read()
                      assert response.status == 200
                      probes += 1
                  time.sleep(0.5)
              print(f"PASS Docker HTTP: {probes} healthchecks despite silent connections beyond {timeout}s")
          PY
          docker compose logs --no-color web | python -c 'import sys; logs=sys.stdin.read(); assert "WORKER TIMEOUT" not in logs; assert "no URI read" not in logs'
      - name: Browser accounts journey on mobile and desktop
        run: |
          uv run --frozen --group browser python scripts/browser_smoke.py --browser "$(command -v google-chrome || command -v chromium)"
          uv run --frozen --group browser python scripts/accounts_browser_smoke.py --browser "$(command -v google-chrome || command -v chromium)"
      - name: Product journey
        run: uv run --frozen --group browser python scripts/product_browser_smoke.py --browser "$(command -v google-chrome || command -v chromium)"
      - name: Quick add with and without JavaScript
        run: uv run --frozen --group browser python scripts/catalogue_browser_smoke.py --browser "$(command -v google-chrome || command -v chromium)"
      - name: Responsive UI, navigation, filters and no-JavaScript journey
        run: uv run --frozen --group browser python scripts/ui_browser_smoke.py --browser "$(command -v google-chrome || command -v chromium)"
      - name: Preserve responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muqola-responsive-screenshots
          path: |
            work/ui-redesign/screenshots/*.png
            work/ui-redesign/result.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Dev Container configuration
        run: |
          mkdir -p work
          npx --yes @devcontainers/cli@0.90.0 read-configuration --workspace-folder "$GITHUB_WORKSPACE" > work/devcontainer-configuration.json
      - name: Codespaces HTTPS profile behind the forwarding proxy
        env:
          CODESPACES: 'true'
          CODESPACE_NAME: muqola-ci-preview
          GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: app.github.dev
          APP_ENV: development
        run: |
          docker compose down
          docker image tag muqola:local muqola:codespaces
          docker compose --project-name muqola-codespaces -f compose.yaml -f .devcontainer/compose.codespaces.yaml up --no-build --wait --wait-timeout 120
          uv run --frozen python -m scripts.codespaces_https_smoke
      - name: Cleanup Codespaces profile
        if: always()
        env:
          CODESPACE_NAME: muqola-ci-preview
        run: docker compose --project-name muqola-codespaces -f compose.yaml -f .devcontainer/compose.codespaces.yaml down
      - name: Compose diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=60
      - name: Cleanup local containers
        if: always()
        run: docker compose down
