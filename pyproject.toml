[project]
name = "muqola"
version = "0.0.1"
description = "Monolithe modulaire de prêt de jeux entre communautés privées"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.8,<7",
]

[dependency-groups]
dev = [
  "django-stubs>=5.2,<5.3",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
  "pytest-django>=4.10,<5",
  "ruff>=0.11,<1",
]

browser = ["playwright==1.62.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"**/migrations/**" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"
